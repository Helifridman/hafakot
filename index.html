<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>שיוך הפקות</title>
<style>
  :root{
    --bg:#f4f6fb; --card:#ffffff; --text:#1c2333; --muted:#6b7280;
    --primary:#4f46e5; --primary-soft:#eef2ff; --green:#16a34a;
    --border:#e5e7eb; --radius:14px; --shadow:0 1px 3px rgba(16,24,40,.08);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{
    font-family:-apple-system,"Segoe UI",Roboto,"Heebo",Arial,sans-serif;
    background:var(--bg); color:var(--text); padding-bottom:70px;
  }
  header{
    position:sticky; top:0; z-index:20; background:var(--primary); color:#fff;
    padding:12px 16px; display:flex; align-items:center; justify-content:space-between;
    box-shadow:var(--shadow);
  }
  header h1{font-size:1.1rem; margin:0; font-weight:700;}
  .conn-dot{width:10px; height:10px; border-radius:50%; background:#f87171; display:inline-block;}
  .conn-dot.online{background:#4ade80;}

  #offlineBanner{
    display:none; background:#fef3c7; color:#92400e; padding:9px 14px;
    font-size:.85rem; text-align:center; border-bottom:1px solid #fde68a;
  }
  #offlineBanner.show{display:block;}

  main{max-width:560px; margin:0 auto; padding:12px;}
  section.tab{display:none;}
  section.tab.active{display:block;}
  .card{
    background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
    box-shadow:var(--shadow); padding:14px 16px; margin-bottom:12px;
  }
  .card h2{margin:0 0 12px; font-size:1.05rem;}
  .card h3{margin:0 0 10px; font-size:.95rem; color:var(--muted); font-weight:600;}

  .me-row{
    display:flex; align-items:center; justify-content:space-between; padding:10px 16px;
    font-size:.9rem; color:var(--muted);
  }
  .me-row b{color:var(--text);}
  .me-change{
    border:none; background:none; color:var(--primary); font-size:.85rem; cursor:pointer;
    font-weight:600; padding:4px;
  }

  /* ===== poll options ===== */
  .poll-opt{
    position:relative; display:flex; align-items:center; gap:10px;
    border:1.5px solid var(--border); border-radius:12px; margin-bottom:10px;
    padding:16px 14px; cursor:pointer; background:#fff; overflow:hidden;
  }
  .poll-opt:active{transform:scale(.98);}
  .poll-fill{
    position:absolute; inset-block:0; right:0; background:var(--primary-soft);
    z-index:0; border-radius:0; transition:width .3s;
  }
  .poll-opt > *:not(.poll-fill){position:relative; z-index:1;}
  .poll-avatar{
    width:40px; height:40px; border-radius:50%; color:#fff; display:flex; align-items:center;
    justify-content:center; font-weight:700; flex-shrink:0; font-size:1rem;
  }
  .poll-name{flex:1; font-weight:700; font-size:1.05rem;}
  .poll-count{
    min-width:34px; height:34px; border-radius:50%; background:var(--primary); color:#fff;
    display:flex; align-items:center; justify-content:center; font-weight:700; font-size:.95rem;
    padding:0 6px;
  }
  .next-badge{
    background:var(--green); color:#fff; font-size:.7rem; padding:3px 8px; border-radius:99px;
    font-weight:700; white-space:nowrap;
  }
  .poll-opt.unavail{opacity:.5; background:#f3f4f6;}
  .poll-opt.unavail .poll-count{background:#9ca3af;}
  .unavail-txt{font-size:.75rem; color:var(--muted); white-space:nowrap;}
  .avail-btn{
    border:none; background:none; font-size:1.05rem; cursor:pointer; padding:6px; line-height:1;
    flex-shrink:0; opacity:.6;
  }

  /* ===== today's list ===== */
  .today-row{
    display:flex; align-items:center; gap:8px; padding:8px 2px; font-size:.9rem;
    border-bottom:1px solid var(--border);
  }
  .today-row:last-child{border-bottom:none;}
  .today-time{color:var(--muted); font-size:.78rem; white-space:nowrap;}
  .today-dot{width:10px; height:10px; border-radius:50%; flex-shrink:0;}
  .empty{text-align:center; color:var(--muted); padding:24px 10px; font-size:.92rem;}

  /* ===== name modal ===== */
  #nameModal{
    position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:60; display:none;
    align-items:center; justify-content:center; padding:20px;
  }
  #nameModal.show{display:flex;}
  .modal-card{
    background:#fff; border-radius:16px; padding:20px; width:100%; max-width:400px;
    max-height:80vh; overflow:auto;
  }
  .modal-card h2{margin:0 0 14px; font-size:1.05rem; text-align:center;}
  .name-btn{
    display:block; width:100%; padding:13px; margin-bottom:8px; border:1.5px solid var(--border);
    border-radius:12px; background:#fff; font-size:1rem; font-weight:600; cursor:pointer; color:var(--text);
  }
  .name-btn:active{background:var(--primary-soft);}
  .modal-cancel{
    display:block; width:100%; padding:10px; border:none; background:none; color:var(--muted);
    font-size:.9rem; cursor:pointer; margin-top:4px;
  }

  /* ===== summary ===== */
  .scope-tabs{display:flex; gap:6px; margin-bottom:12px;}
  .scope-tabs button{
    flex:1; padding:8px; border-radius:99px; border:1.5px solid var(--border); background:#fff;
    font-size:.88rem; cursor:pointer; color:var(--text);
  }
  .scope-tabs button.on{background:var(--primary); border-color:var(--primary); color:#fff; font-weight:700;}
  table.sum{width:100%; border-collapse:collapse; font-size:.92rem;}
  table.sum th,table.sum td{padding:8px 6px; text-align:right; border-bottom:1px solid var(--border);}
  table.sum th{color:var(--muted); font-size:.8rem; font-weight:600;}
  table.sum td.num{font-weight:700;}
  .btn{
    display:block; width:100%; padding:14px; font-size:1rem; font-weight:700; border:none;
    border-radius:12px; background:var(--primary); color:#fff; cursor:pointer; margin-top:12px;
  }
  .btn.secondary{background:#fff; color:var(--primary); border:1.5px solid var(--primary);}

  /* ===== admin ===== */
  .admin-row{display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--border);}
  .admin-row:last-child{border-bottom:none;}
  .admin-row .name{flex:1; font-weight:600;}
  .mini-btn{
    border:1.5px solid var(--border); background:#fff; border-radius:8px; padding:6px 10px;
    font-size:.78rem; cursor:pointer; color:var(--muted); white-space:nowrap;
  }
  .mini-btn.danger{color:#dc2626; border-color:#fecaca;}
  .add-row{display:flex; gap:8px; margin-top:12px;}
  .add-row input{
    flex:1; padding:11px; font-size:1rem; border:1px solid var(--border); border-radius:10px;
  }
  .add-row button{
    background:var(--primary); color:#fff; border:none; border-radius:10px; padding:0 18px;
    font-size:1.2rem; cursor:pointer;
  }
  input[type=password]{
    width:100%; padding:12px; font-size:1rem; border:1px solid var(--border); border-radius:10px;
  }
  label.fld{display:block; font-size:.85rem; color:var(--muted); margin:10px 0 6px;}
  .mini-avatar{
    width:30px; height:30px; border-radius:50%; color:#fff; display:flex; align-items:center;
    justify-content:center; font-weight:700; font-size:.8rem; flex-shrink:0;
  }

  /* ===== bottom nav ===== */
  nav.bottom{
    position:fixed; bottom:0; right:0; left:0; z-index:30; background:#fff;
    border-top:1px solid var(--border); display:flex; padding-bottom:env(safe-area-inset-bottom);
  }
  nav.bottom button{
    flex:1; background:none; border:none; padding:8px 4px 7px; font-size:.72rem; color:var(--muted);
    display:flex; flex-direction:column; align-items:center; gap:2px; cursor:pointer;
  }
  nav.bottom button .ico{font-size:1.3rem; line-height:1;}
  nav.bottom button.on{color:var(--primary); font-weight:700;}

  #toast{
    position:fixed; bottom:80px; right:50%; transform:translateX(50%); z-index:70;
    background:#1c2333; color:#fff; padding:11px 20px; border-radius:99px; font-size:.9rem;
    opacity:0; pointer-events:none; transition:opacity .25s; max-width:90%; text-align:center;
  }
  #toast.show{opacity:1;}
</style>
</head>
<body>

<header>
  <h1>📋 שיוך הפקות</h1>
  <span class="conn-dot" id="connDot"></span>
</header>
<div id="offlineBanner">⚠️ אין חיבור — הסימון יסונכרן כשהאינטרנט יחזור</div>

<main>

  <!-- ============ מסך ראשי (סקר) ============ -->
  <section class="tab active" id="tab-main">
    <div class="card me-row">
      <span>אני: <b id="meName">לא נבחר</b></span>
      <button class="me-change" onclick="openNameModal(null)">החלפה</button>
    </div>
    <div class="card">
      <h2>סגרת עסקה? סמן למי העברת 👇</h2>
      <div id="pollList"></div>
    </div>
    <div class="card">
      <h3 id="todayTitle">ההפקות של היום</h3>
      <div id="todayList"></div>
    </div>
  </section>

  <!-- ============ סיכומים ============ -->
  <section class="tab" id="tab-summary">
    <div class="card">
      <div class="scope-tabs">
        <button class="on" data-scope="day" onclick="setScope('day')">היום</button>
        <button data-scope="week" onclick="setScope('week')">השבוע</button>
        <button data-scope="month" onclick="setScope('month')">החודש</button>
      </div>
      <h2>🗂️ הפקות לפי בק אופיס</h2>
      <div id="sumBO"></div>
      <h2 style="margin-top:18px;">💪 לפי משווק</h2>
      <div id="sumMk"></div>
      <button class="btn" onclick="copySummary()">📋 העתק סיכום לקבוצה</button>
      <button class="btn secondary" onclick="shareWhatsapp()">💬 שתף בווצאפ</button>
    </div>
  </section>

  <!-- ============ ניהול ============ -->
  <section class="tab" id="tab-admin">
    <div class="card" id="adminLock">
      <h2>🔒 מסך ניהול</h2>
      <label class="fld">קוד גישה</label>
      <input type="password" id="adminCodeInput" inputmode="numeric" placeholder="הקלידי קוד">
      <button class="btn" onclick="tryAdmin()">כניסה</button>
    </div>
    <div id="adminArea" style="display:none;">
      <div class="card">
        <h2>👩‍💼 בנות בק אופיס</h2>
        <div id="adminBO"></div>
        <div class="add-row">
          <input type="text" id="newBOName" placeholder="שם חדש…" maxlength="30">
          <button onclick="addBO()">＋</button>
        </div>
      </div>
      <div class="card">
        <h2>🧑‍💼 משווקים</h2>
        <div id="adminMk"></div>
        <div class="add-row">
          <input type="text" id="newMkName" placeholder="שם חדש…" maxlength="30">
          <button onclick="addMk()">＋</button>
        </div>
      </div>
    </div>
  </section>

</main>

<nav class="bottom">
  <button id="nav-main" class="on" onclick="switchTab('main')"><span class="ico">📋</span>ראשי</button>
  <button id="nav-summary" onclick="switchTab('summary')"><span class="ico">📊</span>סיכומים</button>
  <button id="nav-admin" onclick="switchTab('admin')"><span class="ico">⚙️</span>ניהול</button>
</nav>

<!-- בחירת "מי אני" -->
<div id="nameModal">
  <div class="modal-card">
    <h2>מי את/ה? 🙂</h2>
    <div id="nameList"></div>
    <button class="modal-cancel" onclick="closeNameModal()">ביטול</button>
  </div>
</div>

<div id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
/* ⚙️ הגדרות Firebase */
const firebaseConfig = {
  apiKey:            "AIzaSyBzCy1wrqNgIo4KlE67ctjccFdEEMdvX8w",
  authDomain:        "hafakot-2fc1f.firebaseapp.com",
  databaseURL:       "https://hafakot-2fc1f-default-rtdb.europe-west1.firebasedatabase.app",
  projectId:         "hafakot-2fc1f",
  storageBucket:     "hafakot-2fc1f.firebasestorage.app",
  messagingSenderId: "560750358812",
  appId:             "1:560750358812:web:9a8c93d3392180ca498ad9"
};
const ADMIN_CODE = "1234";   // 🔑 קוד מסך הניהול

const PALETTE = ["#e74c3c","#3498db","#27ae60","#9b59b6","#f39c12","#16a085","#e91e63","#795548","#607d8b","#ff5722"];

let db=null, marketers={}, backoffice={}, deals={};
let scope="day", pendingAssignee=null;

/* ---------- תאריכים ---------- */
const pad = n => String(n).padStart(2,"0");
function dayKey(ts){ const d=new Date(ts); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
const todayKey = () => dayKey(Date.now());
function startOfDay(){ const d=new Date(); d.setHours(0,0,0,0); return d.getTime(); }
function startOfWeek(){ const d=new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()-d.getDay()); return d.getTime(); }
function startOfMonth(){ const d=new Date(); d.setHours(0,0,0,0); d.setDate(1); return d.getTime(); }
const fmtTime = ts => new Date(ts).toLocaleTimeString("he-IL",{hour:"2-digit",minute:"2-digit"});
const fmtDate = ts => new Date(ts).toLocaleDateString("he-IL",{day:"numeric",month:"numeric",year:"numeric"});

/* ---------- Firebase ---------- */
firebase.initializeApp(firebaseConfig);
db = firebase.database();
db.ref(".info/connected").on("value", s => {
  const on = s.val() === true;
  document.getElementById("connDot").classList.toggle("online", on);
  document.getElementById("offlineBanner").classList.toggle("show", !on);
});
db.ref("config/marketers").on("value", s => { marketers = s.val()||{}; renderAll(); });
db.ref("config/backoffice").on("value", s => { backoffice = s.val()||{}; renderAll(); });
db.ref("deals").orderByChild("ts").limitToLast(1500).on("value", s => { deals = s.val()||{}; renderAll(); });

/* ---------- ניווט ---------- */
function switchTab(name){
  document.querySelectorAll("section.tab").forEach(el=>el.classList.remove("active"));
  document.querySelectorAll("nav.bottom button").forEach(el=>el.classList.remove("on"));
  document.getElementById("tab-"+name).classList.add("active");
  document.getElementById("nav-"+name).classList.add("on");
  window.scrollTo(0,0);
}
function toast(msg){
  const t=document.getElementById("toast");
  t.textContent=msg; t.classList.add("show");
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"), 2500);
}

/* ---------- חישובים ---------- */
function dealList(){ return Object.entries(deals).map(([id,d])=>({id,...d})).sort((a,b)=>(a.ts||0)-(b.ts||0)); }
function boStats(){
  const list=dealList(), sd=startOfDay();
  const st={};
  Object.keys(backoffice).forEach(id => st[id]={day:0,last:0});
  list.forEach(d=>{
    if(!st[d.assigneeId]) return;
    if(d.ts>=sd) st[d.assigneeId].day++;
    if(d.ts>st[d.assigneeId].last) st[d.assigneeId].last=d.ts;
  });
  return st;
}
function isAvailable(bo){ return bo.unavailable !== todayKey(); }
function nextInLineId(){
  const st=boStats();
  let best=null, bestLast=Infinity;
  Object.entries(backoffice).forEach(([id,bo])=>{
    if(!isAvailable(bo)) return;
    if(st[id].last < bestLast){ bestLast=st[id].last; best=id; }
  });
  return best;
}

/* ---------- הסקר ---------- */
function renderPoll(){
  const st=boStats(), next=nextInLineId();
  const entries=Object.entries(backoffice);
  const maxDay=Math.max(1, ...entries.map(([id])=>st[id].day));
  const html=entries.map(([id,bo])=>{
    const avail=isAvailable(bo);
    const fillPct=Math.round(st[id].day/maxDay*88);
    if(!avail){
      return `<div class="poll-opt unavail">
        <div class="poll-avatar" style="background:${bo.color}">${esc(bo.name.slice(0,2))}</div>
        <div class="poll-name">${esc(bo.name)}</div>
        <span class="unavail-txt">לא זמינה היום</span>
        <button class="avail-btn" title="החזרה לתור" onclick="event.stopPropagation();markAvail('${id}')">↩️</button>
      </div>`;
    }
    return `<div class="poll-opt" onclick="pollTap('${id}')">
      <div class="poll-fill" style="width:${st[id].day?fillPct:0}%"></div>
      <div class="poll-avatar" style="background:${bo.color}">${esc(bo.name.slice(0,2))}</div>
      <div class="poll-name">${esc(bo.name)}</div>
      ${id===next?'<span class="next-badge">⭐ הבאה בתור</span>':""}
      <div class="poll-count">${st[id].day}</div>
      <button class="avail-btn" title="סימון כלא זמינה היום" onclick="event.stopPropagation();markUnavail('${id}')">🚫</button>
    </div>`;
  }).join("");
  document.getElementById("pollList").innerHTML = html || '<div class="empty">אין שמות עדיין — מוסיפים במסך ⚙️ ניהול</div>';
}

function pollTap(id){
  if(!backoffice[id] || !isAvailable(backoffice[id])) return;
  const me=localStorage.getItem("myName");
  if(!me){ pendingAssignee=id; openNameModal(id); return; }
  if(confirm("להעביר הפקה ל"+backoffice[id].name+"?")) recordDeal(me, id);
}
function recordDeal(me, id){
  db.ref("deals").push({
    marketer:me, assigneeId:id, assigneeName:backoffice[id].name,
    ts:firebase.database.ServerValue.TIMESTAMP
  });
  toast("🎉 נרשם! ההפקה עברה ל"+backoffice[id].name);
}

/* ---------- זמינות ---------- */
function markUnavail(id){
  if(!backoffice[id]) return;
  if(confirm("לסמן את "+backoffice[id].name+" כלא זמינה היום? (התור ידלג עליה)"))
    db.ref("config/backoffice/"+id+"/unavailable").set(todayKey());
}
function markAvail(id){
  if(!backoffice[id]) return;
  db.ref("config/backoffice/"+id+"/unavailable").set("");
  toast(backoffice[id].name+" חזרה לתור 👍");
}

/* ---------- מי אני ---------- */
let nameOptions=[];
function openNameModal(assigneeId){
  pendingAssignee=assigneeId;
  nameOptions=Object.values(marketers).map(m=>m.name);
  document.getElementById("nameList").innerHTML =
    nameOptions.map((n,i)=>`<button class="name-btn" onclick="pickNameIdx(${i})">${esc(n)}</button>`).join("")
    || '<div class="empty">אין משווקים עדיין — מוסיפים במסך הניהול</div>';
  document.getElementById("nameModal").classList.add("show");
}
function pickNameIdx(i){ if(nameOptions[i]!==undefined) pickName(nameOptions[i]); }
function closeNameModal(){ document.getElementById("nameModal").classList.remove("show"); pendingAssignee=null; }
function pickName(name){
  localStorage.setItem("myName", name);
  document.getElementById("nameModal").classList.remove("show");
  renderMe();
  if(pendingAssignee){
    const id=pendingAssignee; pendingAssignee=null;
    if(confirm("להעביר הפקה ל"+backoffice[id].name+"?")) recordDeal(name, id);
  }
}
function renderMe(){
  document.getElementById("meName").textContent = localStorage.getItem("myName") || "לא נבחר";
}

/* ---------- רשימת היום ---------- */
function renderToday(){
  const sd=startOfDay();
  const today=dealList().filter(d=>d.ts>=sd).reverse();
  document.getElementById("todayTitle").textContent = "ההפקות של היום ("+today.length+") · "+fmtDate(Date.now());
  document.getElementById("todayList").innerHTML = today.length ? today.map(d=>{
    const color=(backoffice[d.assigneeId]||{}).color||"#9ca3af";
    return `<div class="today-row">
      <span class="today-time">${fmtTime(d.ts)}</span>
      <span>${esc(d.marketer)}</span> ➤
      <span class="today-dot" style="background:${color}"></span><b>${esc(d.assigneeName)}</b>
    </div>`;
  }).join("") : '<div class="empty">עדיין אין הפקות היום 🚀</div>';
}

/* ---------- סיכומים ---------- */
function setScope(s){
  scope=s;
  document.querySelectorAll(".scope-tabs button").forEach(b=>b.classList.toggle("on",b.dataset.scope===s));
  renderSummary();
}
function scopeStart(){ return scope==="day"?startOfDay():scope==="week"?startOfWeek():startOfMonth(); }
const scopeName=()=>({day:"היום",week:"השבוע",month:"החודש"})[scope];
function summaryData(){
  const from=scopeStart(), list=dealList().filter(d=>d.ts>=from);
  const bo={}, mk={};
  list.forEach(d=>{
    bo[d.assigneeName]=(bo[d.assigneeName]||0)+1;
    mk[d.marketer]=(mk[d.marketer]||0)+1;
  });
  return {bo,mk,total:list.length};
}
function tableHTML(obj){
  const rows=Object.entries(obj).sort((a,b)=>b[1]-a[1]);
  if(!rows.length) return '<div class="empty" style="padding:12px;">אין נתונים בתקופה זו</div>';
  return '<table class="sum"><tr><th>שם</th><th>הפקות</th></tr>'+
    rows.map(([n,c])=>`<tr><td>${esc(n)}</td><td class="num">${c}</td></tr>`).join("")+"</table>";
}
function renderSummary(){
  const {bo,mk}=summaryData();
  document.getElementById("sumBO").innerHTML=tableHTML(bo);
  document.getElementById("sumMk").innerHTML=tableHTML(mk);
}
function summaryText(){
  const {bo,mk,total}=summaryData();
  let t=`📊 סיכום הפקות — ${scopeName()} (${fmtDate(Date.now())})\n`;
  t+=`סה"כ: ${total} הפקות\n\n🗂️ בק אופיס:\n`;
  t+=Object.entries(bo).sort((a,b)=>b[1]-a[1]).map(([n,c])=>`• ${n} — ${c}`).join("\n")||"• —";
  t+=`\n\n💪 משווקים:\n`;
  t+=Object.entries(mk).sort((a,b)=>b[1]-a[1]).map(([n,c])=>`• ${n} — ${c}`).join("\n")||"• —";
  return t;
}
function copySummary(){
  const txt=summaryText();
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(()=>toast("הסיכום הועתק 📋")).catch(()=>fallbackCopy(txt));
  } else fallbackCopy(txt);
}
function fallbackCopy(txt){
  const ta=document.createElement("textarea"); ta.value=txt; document.body.appendChild(ta);
  ta.select(); document.execCommand("copy"); ta.remove(); toast("הסיכום הועתק 📋");
}
function shareWhatsapp(){ window.open("https://wa.me/?text="+encodeURIComponent(summaryText()),"_blank"); }

/* ---------- ניהול ---------- */
function tryAdmin(){
  if(document.getElementById("adminCodeInput").value===ADMIN_CODE){
    sessionStorage.setItem("adminOk","1"); renderAdmin();
  } else toast("קוד שגוי");
}
function renderAdmin(){
  if(sessionStorage.getItem("adminOk")!=="1") return;
  document.getElementById("adminLock").style.display="none";
  document.getElementById("adminArea").style.display="block";
  document.getElementById("adminBO").innerHTML=Object.entries(backoffice).map(([id,bo])=>{
    const off=!isAvailable(bo);
    return `<div class="admin-row">
      <div class="mini-avatar" style="background:${bo.color}">${esc(bo.name.slice(0,2))}</div>
      <div class="name">${esc(bo.name)}${off?' <span style="color:#dc2626;font-size:.75rem;">(לא זמינה היום)</span>':""}</div>
      <button class="mini-btn danger" onclick="delBO('${id}')">מחיקה</button></div>`;
  }).join("")||'<div class="empty" style="padding:10px;">אין עדיין — מוסיפים למטה</div>';
  document.getElementById("adminMk").innerHTML=Object.entries(marketers).map(([id,m])=>
    `<div class="admin-row"><div class="name">${esc(m.name)}</div>
     <button class="mini-btn danger" onclick="delMk('${id}')">מחיקה</button></div>`
  ).join("")||'<div class="empty" style="padding:10px;">אין עדיין — מוסיפים למטה</div>';
}
function addBO(){
  const inp=document.getElementById("newBOName"), name=inp.value.trim();
  if(!name) return;
  db.ref("config/backoffice").push({name, color:PALETTE[Object.keys(backoffice).length%PALETTE.length], unavailable:""});
  inp.value="";
}
function addMk(){
  const inp=document.getElementById("newMkName"), name=inp.value.trim();
  if(!name) return;
  db.ref("config/marketers").push({name});
  inp.value="";
}
function delBO(id){ if(confirm("למחוק את "+backoffice[id].name+"?")) db.ref("config/backoffice/"+id).remove(); }
function delMk(id){ if(confirm("למחוק את "+marketers[id].name+"?")) db.ref("config/marketers/"+id).remove(); }

/* ---------- כללי ---------- */
function esc(s){ return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function renderAll(){ renderPoll(); renderToday(); renderSummary(); renderAdmin(); renderMe(); }
renderAll();
setInterval(renderAll, 60*1000);
</script>
</body>
